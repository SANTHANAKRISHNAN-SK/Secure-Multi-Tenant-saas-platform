{% extends "base.html" %}
{% set hide_shell = true %}
{% block title %}Error {{ code }}{% endblock %}
{% block auth_content %}
<div class="auth-card" style="max-width: 560px;">
  <div class="auth-form-side w-100 text-center">
    <div class="mb-3">
      <span class="badge rounded-pill bg-danger-subtle text-danger px-3 py-2" style="font-size:1rem;">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>Error {{ code }}
      </span>
    </div>
    <h3 class="fw-bold mb-2">Something didn't go as planned</h3>
    <p class="text-muted mb-4">{{ message }}</p>
    <a href="{{ url_for('auth_pages.index') }}" class="btn btn-brand px-4">
      <i class="fa-solid fa-house me-2"></i>Back to safety
    </a>
  </div>
</div>
{% endblock %}
